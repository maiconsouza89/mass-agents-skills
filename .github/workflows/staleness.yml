name: Stale skills review

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Build report
        id: report
        run: |
          node tools/staleness-report.ts --days 90 --format json > stale.json
          node tools/staleness-report.ts --days 90 --format markdown --repo "${{ github.repository }}" > stale.md
          echo "count=$(node -e "console.log(JSON.parse(require('fs').readFileSync('stale.json','utf8')).stale.length)")" >> "$GITHUB_OUTPUT"

      - name: Open, update or close the tracking issue
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs')
            const body = fs.readFileSync('stale.md', 'utf8')
            const count = Number('${{ steps.report.outputs.count }}')
            const title = 'Stale skills review'
            const label = 'skills-staleness'
            const { owner, repo } = context.repo
            const existing = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: label, per_page: 10 })
            const issue = existing.data.find((item) => item.title === title)
            if (count === 0) {
              if (issue) {
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: 'All skills are reviewed. Closing until the next stale one shows up.' })
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' })
              }
              return
            }
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label })
            } catch {
              await github.rest.issues.createLabel({ owner, repo, name: label, color: '5e6ad2', description: 'Skills past their review window' })
            }
            if (issue) {
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, body })
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: [label] })
            }
